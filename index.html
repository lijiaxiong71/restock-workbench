<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>店内补货工作台</title>
<style>
  :root{
    --bg:#e9f2fc; --card:#ffffff; --line:#dde7f3; --line-soft:#eaf1f9;
    --text:#2b2f36; --muted:#8b919c; --muted-2:#aab0bb;
    --accent:#1f9d74; --accent-soft:#e6f6f0; --accent-ink:#137a59;
    --danger:#e5573f; --danger-soft:#fdecea; --warn:#e08a1e; --warn-soft:#fdf3e3;
    --ok:#2ea36b; --ok-soft:#e9f6ef;
    --shadow:0 1px 2px rgba(20,30,50,.04), 0 6px 20px rgba(20,30,50,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.6; color:var(--text);
    background:linear-gradient(180deg,#e3eefb 0%, #eaf3fc 45%, #f3f8fe 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  /* top bar */
  .topbar{
    position:sticky; top:0; z-index:30; background:rgba(255,255,255,.88);
    backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line); padding:14px 22px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .logo{
    width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(135deg,var(--accent),#37b88c);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px;
    box-shadow:0 4px 12px rgba(31,157,116,.28);
  }
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.3px}
  .brand p{margin:0; font-size:12.5px; color:var(--muted)}
  .stats{display:flex; gap:10px; margin-left:auto; flex-wrap:wrap}
  .stat{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:11px; padding:7px 14px; min-width:78px; text-align:center; box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .stat:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(20,30,50,.1)}
  .stat b{display:block; font-size:19px; line-height:1.2; font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px; color:var(--muted)}
  .stat:first-child{border-left-color:var(--accent)}
  .stat.zero{border-left-color:var(--danger)} .stat.low{border-left-color:var(--warn)} .stat.ok{border-left-color:var(--ok)}
  .stat.zero b{color:var(--danger)} .stat.low b{color:var(--warn)} .stat.ok b{color:var(--ok)}

  .wrap{max-width:1280px; margin:0 auto; padding:18px 22px 40px;
    display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start}
  @media(max-width:980px){ .wrap{grid-template-columns:1fr} }

  /* filter card */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); transition:box-shadow .2s, transform .2s}
  .panel:hover{box-shadow:0 2px 5px rgba(20,30,50,.05), 0 12px 30px rgba(20,30,50,.09)}
  .filters{padding:16px 18px; display:flex; flex-direction:column; gap:13px}
  .search{position:relative}
  .search input{
    width:100%; height:44px; padding:0 90px 0 42px; font-size:15px;
    border:1px solid var(--line); border-radius:12px; background:#fbfcfe; color:var(--text);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff}
  .search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted-2)}
  .scan-btn{
    position:absolute; right:7px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border:none; border-radius:9px; cursor:pointer;
    background:var(--accent-soft); color:var(--accent-ink); font-size:17px;
    display:flex; align-items:center; justify-content:center; transition:background .12s;
  }
  .scan-btn:hover{background:#d7efe6}
  .qr-btn{
    position:absolute; right:48px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border:none; border-radius:9px; cursor:pointer;
    background:#e3eefb; color:#1f5fa8; font-size:17px;
    display:flex; align-items:center; justify-content:center; transition:background .12s;
  }
  .qr-btn:hover{background:#d2e2f6}
  .qr-modal{position:fixed; inset:0; background:rgba(20,30,45,.55); display:none; align-items:center; justify-content:center; z-index:80; padding:20px}
  .qr-modal.show{display:flex}
  .qr-card{background:#fff; border-radius:18px; padding:22px; width:min(340px,92%); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .qr-card h3{margin:0 0 4px; font-size:17px; color:var(--text)}
  .qr-card p{margin:0 0 14px; font-size:13px; color:var(--muted)}
  .qr-card img{width:240px; height:240px; border-radius:12px; margin:0 auto; display:block; border:1px solid var(--line)}
  .qr-card .qr-url{margin-top:12px; font-size:12px; color:var(--muted-2); word-break:break-all; background:#f6f9fd; padding:8px 10px; border-radius:8px}
  .qr-card .btn{margin-top:14px; width:100%}
  .scan-box{background:#0e1726; border-radius:16px; width:min(420px,92%); overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .scan-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; color:#fff; font-weight:600; background:#15233a}
  .scan-x{border:none; background:none; color:#fff; font-size:17px; cursor:pointer; opacity:.8}
  .scan-view{position:relative; aspect-ratio:4/3; background:#000; overflow:hidden}
  .scan-view video{width:100%; height:100%; object-fit:cover; display:block}
  .scan-frame{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:72%; height:42%; border:2px solid rgba(255,255,255,.9); border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none}
  .scan-line{position:absolute; left:14%; right:14%; top:29%; height:2px; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:scanmove 1.8s ease-in-out infinite}
  @keyframes scanmove{0%{top:29%}50%{top:67%}100%{top:29%}}
  .scan-tip{color:#cdd6e4; font-size:13px; text-align:center; padding:10px 14px}
  .scan-manual{display:flex; gap:8px; padding:0 14px 14px}
  .scan-manual input{flex:1; height:42px; border:none; border-radius:10px; padding:0 12px; font-size:15px; outline:none}
  .scan-manual .btn{width:auto; padding:0 18px; margin-top:0}
  .chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .chips .lbl{font-size:12.5px; color:var(--muted); margin-right:2px}
  .chip{
    border:1px solid var(--line); background:#fff; color:#5a606b; border-radius:999px;
    padding:6px 13px; font-size:13.5px; cursor:pointer; user-select:none; transition:all .12s;
  }
  .chip:hover{border-color:#cfd5de}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .chip.warn.active{background:var(--warn); border-color:var(--warn)}
  .chip.danger.active{background:var(--danger); border-color:var(--danger)}
  .toolbar2{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .resultline{font-size:13px; color:var(--muted)}
  .resultline b{color:var(--text); font-variant-numeric:tabular-nums}

  /* table */
  .tablecard{margin-top:16px; overflow:hidden}
  .table-scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  thead th{
    position:sticky; top:0; background:#f2f7fd; text-align:left; padding:9px 14px;
    font-size:12px; font-weight:600; color:#7a818d; border-bottom:1px solid #d6e2f2;
    white-space:nowrap; z-index:5;
  }
  tbody td{padding:9px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
  tbody tr:hover{background:#f3f8fe}
  .pname{font-weight:600; color:var(--text)}
  .pbarcode{font-size:12px; color:var(--muted-2); font-variant-numeric:tabular-nums; margin-top:1px}
  .tag{display:inline-block; padding:2px 9px; border-radius:7px; font-size:12px; background:#f0f2f6; color:#5a606b}
  .sup-tag{font-size:12px; color:var(--accent-ink); background:var(--accent-soft); padding:2px 9px; border-radius:7px; font-weight:600}
  .price{font-variant-numeric:tabular-nums; font-weight:600}
  .mem{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
  .stock{font-variant-numeric:tabular-nums; font-weight:700; font-size:14.5px}
  .badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; margin-left:5px; vertical-align:middle}
  .badge.zero{background:var(--danger-soft); color:var(--danger)}
  .badge.low{background:var(--warn-soft); color:var(--warn)}
  .badge.ok{background:var(--ok-soft); color:var(--ok)}
  .num-cell{font-variant-numeric:tabular-nums; color:#5a606b}

  /* stepper */
  .stepper{display:inline-flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff}
  .stepper button{
    width:30px; height:32px; border:none; background:#fbfcfe; color:#5a606b; font-size:17px;
    cursor:pointer; line-height:1; transition:background .12s;
  }
  .stepper button:hover{background:var(--accent-soft); color:var(--accent-ink)}
  .stepper button:disabled{color:#cfd5de; cursor:not-allowed; background:#fbfcfe}
  .stepper input{
    width:46px; height:32px; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line);
    text-align:center; font-size:14px; color:var(--text); background:#fff; outline:none; font-variant-numeric:tabular-nums;
  }
  .ou-hint{font-size:11px; color:var(--muted-2); text-align:center; margin-top:4px; letter-spacing:.3px}
  .empty{padding:46px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-size:34px; margin-bottom:8px}

  /* pagination */
  .pager{display:flex; align-items:center; justify-content:center; gap:10px; padding:13px; border-top:1px solid var(--line)}
  .pager button{
    border:1px solid var(--line); background:#fff; color:#5a606b; border-radius:9px;
    padding:6px 14px; font-size:13.5px; cursor:pointer; transition:all .12s;
  }
  .pager button:hover:not(:disabled){border-color:var(--accent); color:var(--accent-ink)}
  .pager button:disabled{opacity:.45; cursor:not-allowed}
  .pager .pg{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}

  /* cart */
  .cart{position:sticky; top:88px}
  .cart .chead{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
  .cart .chead h2{margin:0; font-size:16px}
  .cart .chead .cnt{margin-left:auto; background:var(--accent); color:#fff; border-radius:999px; font-size:12.5px; padding:1px 9px; font-weight:700; font-variant-numeric:tabular-nums}
  .cart .cbody{max-height:calc(100vh - 320px); overflow-y:auto; padding:6px 12px}
  .cgroup{padding:8px 6px 4px}
  .cgroup .gt{font-size:12.5px; color:var(--accent-ink); font-weight:700; background:var(--accent-soft); padding:3px 10px 3px 11px; border-left:3px solid var(--accent); border-radius:5px 7px 7px 5px; display:inline-block; margin-bottom:4px}
  .citem{display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed var(--line-soft)}
  .citem .ci-name{font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .citem .ci-q{font-variant-numeric:tabular-nums; font-weight:600; color:var(--text); font-size:13px}
  .citem .ci-sub{font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; min-width:62px; text-align:right}
  .citem .ci-x{border:none; background:none; color:var(--muted-2); cursor:pointer; font-size:15px; padding:0 2px}
  .citem .ci-x:hover{color:var(--danger)}
  .cart .cfoot{padding:14px 18px; border-top:1px solid var(--line); background:#fafbfd; border-radius:0 0 var(--radius) var(--radius)}
  .totalrow{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:11px}
  .totalrow .t-lbl{font-size:13px; color:var(--muted)}
  .totalrow .t-val{font-size:22px; font-weight:800; color:var(--accent-ink); font-variant-numeric:tabular-nums}
  .totalrow .t-val small{font-size:13px; font-weight:600; color:var(--muted)}
  .btn{
    width:100%; border:none; border-radius:11px; padding:12px; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .08s, box-shadow .15s; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn.primary{background:linear-gradient(135deg,var(--accent),#188a63); color:#fff; box-shadow:0 6px 16px rgba(31,157,116,.32)}
  .btn.primary:hover{background:linear-gradient(135deg,#1b8c68,#157a57); box-shadow:0 8px 22px rgba(31,157,116,.42); transform:translateY(-1px)}
  .btn.primary:active{transform:translateY(1px)}
  .btn.ghost{background:#fff; color:#5a606b; border:1px solid var(--line); margin-top:8px}
  .btn.ghost:hover{border-color:#cfd5de}
  .btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none}
  .cart .chint{font-size:12px; color:var(--muted-2); text-align:center; padding:24px 14px}

  /* mobile bottom-bar cart trigger (hidden on desktop) */
  .mbar{display:none; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; background:#fff}
  .mbar>span:first-child{font-weight:600; font-size:14.5px}
  .mbar .mcount{color:var(--muted); font-size:13px}
  .mbar .mcount b{color:var(--text)}
  .mbar .mtotal{margin-left:auto; font-weight:800; color:var(--accent-ink); font-size:17px; font-variant-numeric:tabular-nums}
  .mbar .mtoggle{font-size:12.5px; color:var(--muted)}
  #cartBackdrop{display:none}

  /* toast */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#2b2f36; color:#fff; padding:11px 18px; border-radius:11px; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:all .25s; z-index:99;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* modal */
  .mask{position:fixed; inset:0; background:rgba(20,28,40,.42); display:none; align-items:center; justify-content:center; z-index:80; padding:20px}
  .mask.show{display:flex}
  .modal{background:#fff; border-radius:16px; width:min(620px,100%); max-height:84vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0; padding:16px 20px; font-size:17px; border-bottom:1px solid var(--line)}
  .modal .mbody{padding:14px 20px; overflow:auto; font-size:13.5px}
  .modal pre{margin:0; white-space:pre-wrap; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; color:#3a4049; background:#f7f9fc; border:1px solid var(--line); border-radius:10px; padding:12px; max-height:46vh; overflow:auto}
  .modal .mfoot{padding:13px 20px; border-top:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap}
  .modal .mfoot .btn{margin:0; width:auto; flex:1 1 auto; min-width:120px}
  .ord-block{margin-bottom:14px}
  .ord-block .oh{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--accent-ink); margin-bottom:5px}
  .ord-block table{font-size:12.5px; margin-top:4px}
  .ord-block th,.ord-block td{padding:6px 8px; border-bottom:1px solid var(--line-soft)}
  .ord-block th{color:var(--muted); font-weight:600}

  /* ======================= MOBILE (phones) ======================= */
  @media (max-width:760px){
    body{font-size:14.5px}
    .topbar{padding:10px 13px; gap:8px}
    .brand h1{font-size:16px}
    .brand p{display:none}
    .logo{width:34px; height:34px; font-size:18px; border-radius:10px}
    .stats{width:100%; margin-left:0; gap:7px}
    .stat{flex:1; min-width:0; padding:6px 6px}
    .stat b{font-size:16px}
    .stat span{font-size:11px}

    .wrap{grid-template-columns:1fr; padding:12px 12px 100px; gap:12px}

    .filters{padding:13px 13px}
    .search input{height:46px}
    .chip{padding:7px 13px; font-size:14px}
    .toolbar2{gap:8px}

    /* product table -> stacked cards */
    .tablecard{margin-top:10px}
    .table-scroll{overflow:visible}
    table,thead,tbody,tr,td{display:block; width:100%}
    thead{display:none}
    tbody tr{border:1px solid var(--line); border-radius:12px; margin-bottom:9px; padding:1px 0; background:#fff; box-shadow:0 1px 2px rgba(20,30,50,.05)}
    tbody tr:hover{background:#fff}
    tbody td{border:none; padding:6px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:right}
    tbody td::before{content:attr(data-label); color:var(--muted); font-size:12px; font-weight:500; flex:none; text-align:left}
    tbody td:first-child{display:block; padding:9px 12px 7px; border-bottom:1px solid var(--line-soft); margin-bottom:1px}
    tbody td:first-child::before{display:none}
    .pname{font-size:15px; font-weight:600; letter-spacing:.2px}
    .pbarcode{font-size:11.5px}
    tbody td:last-child{justify-content:space-between; background:var(--accent-soft); border-radius:0 0 11px 11px; margin-top:4px; padding:8px 12px}
    tbody td:last-child::before{color:var(--accent-ink); font-weight:600; font-size:12px}
    .stepper button{width:36px; height:36px; font-size:18px; border-radius:9px}
    .stepper input{height:36px; width:50px; font-size:14.5px}
    .pager button{padding:8px 18px; font-size:14px}

    /* cart -> fixed bottom sheet */
    .cart{position:fixed; left:0; right:0; bottom:0; top:auto; border-radius:16px 16px 0 0; box-shadow:0 -8px 28px rgba(20,30,50,.16); z-index:60}
    .cart .chead{display:none}
    .cart .mbar{display:flex}
    .cart .cbody{display:none; max-height:50vh}
    .cart.open .cbody{display:block}
    .cart .cfoot{display:none}
    .cart.open .cfoot{display:flex; flex-direction:column}
    .cart.open .cfoot .btn.primary{margin-top:0}
    .cart.open .cfoot .btn.ghost{margin-top:8px}
    #cartBackdrop{position:fixed; inset:0; background:rgba(20,28,40,.42); z-index:55}
    #cartBackdrop.show{display:block}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <h1>店内补货工作台</h1>
        <p>商品查询 · 智能补货 · 一键生成补货单</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>商品总数</span></div>
      <div class="stat zero"><b id="stZero">0</b><span>缺货</span></div>
      <div class="stat low"><b id="stLow">0</b><span>低库存</span></div>
      <div class="stat ok"><b id="stSup">4</b><span>供货商</span></div>
    </div>
  </div>

  <div class="wrap">
    <!-- left: query -->
    <div>
      <div class="panel filters">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="搜索商品名称或条码…" autocomplete="off" />
          <button id="qrBtn" class="qr-btn" title="手机扫码打开" aria-label="手机扫码打开">📱</button>
          <button id="scanBtn" class="scan-btn" title="扫码录入条码" aria-label="扫码录入条码">📷</button>
        </div>
        <div class="chips" id="supChips"><span class="lbl">供货商</span></div>
        <div class="chips" id="catChips"><span class="lbl">分组</span></div>
        <div class="toolbar2">
          <div class="chips">
            <span class="lbl">快捷</span>
            <span class="chip warn" data-q="low">仅看低库存</span>
            <span class="chip danger" data-q="zero">仅看缺货</span>
          </div>
          <div class="resultline">匹配 <b id="resCount">0</b> 个商品</div>
        </div>
      </div>

      <div class="panel tablecard">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th style="min-width:200px">商品</th>
                <th>供货商</th>
                <th>分组</th>
                <th>售价</th>
                <th>会员价</th>
                <th>库存</th>
                <th>单位</th>
                <th>成本</th>
                <th style="text-align:right">补货</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty" style="display:none">
          <div class="big">🔍</div>
          <div>没有匹配的商品，试试调整筛选条件</div>

<script>
(function(){
  const P = window.PRODUCTS || [];
  const PAGE = 40;
  const STORE_KEY = "restock_cart_v1";

  // ---- state ----
  const state = {
    q:"", sup:"全部", cat:"全部", quick:null,
    page:1,
    cart: loadCart()  // {key: qty}
  };

  function loadCart(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
  }
  function saveCart(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.cart)); }catch(e){}
  }
  // stable key for a product
  function keyOf(p){ return (p.barcode && p.barcode!=="") ? p.barcode : (p.supplier+"|"+p.name); }

  // ---- derive suppliers & categories ----
  const suppliers = ["全部", ...Array.from(new Set(P.map(p=>p.supplier)))];
  const categories = ["全部", ...Array.from(new Set(P.map(p=>p.category).filter(Boolean)))];

  // ---- stats ----
  const total = P.length;
  const zero = P.filter(p=>p.stock===0).length;
  const low = P.filter(p=>p.stock>0 && p.stock<=5).length;
  document.getElementById("stTotal").textContent = total;
  document.getElementById("stZero").textContent = zero;
  document.getElementById("stLow").textContent = low;
  document.getElementById("stSup").textContent = suppliers.length-1;

  // ---- build chips ----
  const supWrap = document.getElementById("supChips");
  suppliers.forEach(s=>{
    const c = document.createElement("span");
    c.className = "chip" + (s==="全部"?" active":"");
    c.textContent = s;
    c.onclick = ()=>{ state.sup=s; state.page=1; syncChips(); render(); };
    supWrap.appendChild(c);
  });
  const catWrap = document.getElementById("catChips");
  categories.forEach(cat=>{
    const c = document.createElement("span");
    c.className = "chip" + (cat==="全部"?" active":"");
    c.textContent = cat;
    c.onclick = ()=>{ state.cat=cat; state.page=1; syncChips(); render(); };
    catWrap.appendChild(c);
  });
  document.querySelectorAll('.chip[data-q]').forEach(c=>{
    c.onclick = ()=>{
      const q = c.getAttribute("data-q");
      state.quick = (state.quick===q)? null : q;
      state.page=1; syncChips(); render();
    };
  });

  function syncChips(){
    supWrap.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.textContent===state.sup));
    catWrap.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.textContent===state.cat));
    document.querySelectorAll('.chip[data-q]').forEach(c=> c.classList.toggle('active', c.getAttribute('data-q')===state.quick));
  }

  // ---- search ----
  document.getElementById("q").addEventListener("input", e=>{
    state.q = e.target.value.trim().toLowerCase(); state.page=1; render();
  });

  // ---- filtering ----
  function filtered(){
    return P.filter(p=>{
      if(state.sup!=="全部" && p.supplier!==state.sup) return false;
      if(state.cat!=="全部" && p.category!==state.cat) return false;
      if(state.quick==="zero" && p.stock!==0) return false;
      if(state.quick==="low" && !(p.stock>0 && p.stock<=5)) return false;
      if(state.q){
        const hay = (p.name+" "+(p.barcode||"")).toLowerCase();
        if(!hay.includes(state.q)) return false;
      }
      return true;
    });
  }

  function fmt(n){ return (n==null)? "—" : Number(n).toFixed(2); }

  function stockBadge(p){
    if(p.stock===0) return '<span class="stock" style="color:var(--danger)">0</span><span class="badge zero">缺货</span>';
    if(p.stock<=5) return '<span class="stock" style="color:var(--warn)">'+p.stock+'</span><span class="badge low">低</span>';
    return '<span class="stock" style="color:var(--ok)">'+p.stock+'</span><span class="badge ok">充足</span>';
  }

  // 进货单位：按业务规则推导（仅用于发送补货单，不影响查询目录的销售单位）
  function orderUnit(p){
    const n = p.name || "";
    const price = (p.price==null) ? null : Math.round(p.price*100)/100;
    const sup = p.supplier || "";
    const cat = p.category || "";
    if(n.includes("乐事")){
      if(price===7) return "盒";
      if(price===6 || price===3.5) return "袋";
    }
    if(n.includes("浪味仙")||n.includes("妙脆角")||n.includes("呀土豆")||n.includes("上好佳")) return "袋";
    if(n.includes("薯愿")) return "盒";
    if(n.includes("奥利奥")) return "盒";
    if(n.includes("面包")) return "袋";
    if(n.includes("锅巴")) return "袋";
    if(sup==="饮料" || cat.includes("饮料")) return "件";
    if(price===1 || price===0.5) return "盒";
    return p.unit || "件";
  }

  // ---- render table ----
  const tbody = document.getElementById("tbody");
  const emptyState = document.getElementById("emptyState");
  const resCount = document.getElementById("resCount");

  function render(){
    const list = filtered();
    resCount.textContent = list.length;
    const pages = Math.max(1, Math.ceil(list.length/PAGE));
    if(state.page>pages) state.page = pages;
    const start = (state.page-1)*PAGE;
    const slice = list.slice(start, start+PAGE);

    tbody.innerHTML = "";
    if(list.length===0){
      emptyState.style.display="block";
    } else {
      emptyState.style.display="none";
      slice.forEach(p=>{
        const k = keyOf(p);
        const qty = state.cart[k] || 0;
        const tr = document.createElement("tr");
        tr.innerHTML =
          '<td><div class="pname">'+esc(p.name)+'</div>'+(p.barcode?'<div class="pbarcode">'+esc(p.barcode)+'</div>':'')+'</td>'+
          '<td data-label="供货商"><span class="sup-tag">'+esc(p.supplier)+'</span></td>'+
          '<td data-label="分组">'+(p.category?'<span class="tag">'+esc(p.category)+'</span>':'—')+'</td>'+
          '<td data-label="售价" class="price">¥'+fmt(p.price)+'</td>'+
          '<td data-label="会员价" class="mem">'+(p.memberPrice!=null?'¥'+fmt(p.memberPrice):'—')+'</td>'+
          '<td data-label="库存">'+stockBadge(p)+'</td>'+
          '<td data-label="单位" class="num-cell">'+(p.unit||'—')+'</td>'+
          '<td data-label="成本" class="num-cell">¥'+fmt(p.cost)+'</td>'+
          '<td data-label="补货数量" style="text-align:right">'+stepperHTML(k,qty,p)+'</td>';
        tbody.appendChild(tr);
      });
      bindSteppers();
    }
    document.getElementById("pgInfo").textContent = state.page+" / "+pages;
    document.getElementById("prevPage").disabled = state.page<=1;
    document.getElementById("nextPage").disabled = state.page>=pages;
  }

  function stepperHTML(k,qty,p){
    const ou = p ? orderUnit(p) : '';
    return '<div class="stepper" data-k="'+esc(k)+'">'+
      '<button data-act="dec"'+(qty<=0?' disabled':'')+' aria-label="减少">−</button>'+
      '<input value="'+qty+'" inputmode="numeric" readonly />'+
      '<button data-act="inc" aria-label="增加">+</button></div>'+
      (ou?'<div class="ou-hint">进货 '+ou+'</div>':'');
  }
  function bindSteppers(){
    tbody.querySelectorAll('.stepper').forEach(s=>{
      const k = s.getAttribute("data-k");
      s.querySelector('[data-act="inc"]').onclick = ()=> setQty(k, (state.cart[k]||0)+1);
      s.querySelector('[data-act="dec"]').onclick = ()=> setQty(k, Math.max(0,(state.cart[k]||0)-1));
    });
  }
  function setQty(k, v){
    v = Math.max(0, Math.min(9999, v|0));
    if(v===0) delete state.cart[k]; else state.cart[k]=v;
    saveCart(); render(); renderCart();
  }

  document.getElementById("prevPage").onclick = ()=>{ if(state.page>1){state.page--; render();} };
  document.getElementById("nextPage").onclick = ()=>{ state.page++; render(); };

  // ---- cart render ----
  const cartBody = document.getElementById("cartBody");
  const cartCount = document.getElementById("cartCount");
  const cartTotalEl = document.getElementById("cartTotal");
  const genBtn = document.getElementById("genBtn");
  const clearBtn = document.getElementById("clearBtn");

  function cartItems(){
    return P.filter(p=> state.cart[keyOf(p)]>0).map(p=>({p, qty:state.cart[keyOf(p)]}));
  }
  function renderCart(){
    const items = cartItems();
    const totalQty = items.reduce((s,i)=>s+i.qty,0);
    cartCount.textContent = totalQty;
    cartTotalEl.textContent = totalQty;
    document.getElementById("barCount").textContent = totalQty;
    genBtn.disabled = items.length===0;
    clearBtn.disabled = items.length===0;

    if(items.length===0){
      cartBody.innerHTML = '<div class="chint">在左侧点击商品「+」加入补货清单<br/>清单按供货商自动分组</div>';
      return;
    }
    // group by supplier
    const groups = {};
    items.forEach(i=>{ (groups[i.p.supplier] = groups[i.p.supplier]||[]).push(i); });
    let html = "";
    Object.keys(groups).forEach(sup=>{
      const arr = groups[sup];
      const gq = arr.reduce((s,i)=>s+i.qty,0);
      html += '<div class="cgroup"><span class="gt">'+esc(sup)+' · '+gq+'件</span>';
      arr.forEach(i=>{
        html += '<div class="citem">'+
          '<span class="ci-name" title="'+esc(i.p.name)+'">'+esc(i.p.name)+'</span>'+
          '<span class="ci-q">×'+i.qty+' '+orderUnit(i.p)+'</span>'+
          '<button class="ci-x" data-k="'+esc(keyOf(i.p))+'" title="移除">✕</button></div>';
      });
      html += '</div>';
    });
    cartBody.innerHTML = html;
    cartBody.querySelectorAll('.ci-x').forEach(b=>{
      b.onclick = ()=> setQty(b.getAttribute("data-k"), 0);
    });
  }

  clearBtn.onclick = ()=>{
    if(Object.keys(state.cart).length===0) return;
    state.cart = {}; saveCart(); render(); renderCart(); toast("已清空补货清单");
  };

  // mobile bottom-sheet cart
  const cartEl = document.getElementById("cart");
  const cartBar = document.getElementById("cartBar");
  const cartBackdrop = document.getElementById("cartBackdrop");
  const barToggle = document.getElementById("barToggle");
  function setCartOpen(open){
    cartEl.classList.toggle("open", open);
    cartBackdrop.classList.toggle("show", open);
    barToggle.textContent = open ? "收起 ▾" : "展开 ▴";
  }
  cartBar.addEventListener("click", ()=> setCartOpen(!cartEl.classList.contains("open")));
  cartBackdrop.addEventListener("click", ()=> setCartOpen(false));

  // ---- generate order ----
  const mask = document.getElementById("mask");
  const modalBody = document.getElementById("modalBody");
  let lastCSV = "";
  let lastCanvas = null;

  genBtn.onclick = ()=>{
    const items = cartItems();
    if(items.length===0) return;
    setCartOpen(false);
    const groups = {};
    items.forEach(i=>{ (groups[i.p.supplier] = groups[i.p.supplier]||[]).push(i); });
    let html = "";
    let csv = "商品名称,进货单位,补货数量\n";
    const totalQty = items.reduce((s,i)=>s+i.qty,0);
    Object.keys(groups).forEach(sup=>{
      const arr = groups[sup];
      const gq = arr.reduce((s,i)=>s+i.qty,0);
      csv += "\n供货商："+sup+"\n";
      html += '<div class="ord-block"><div class="oh">📦 '+esc(sup)+' · '+gq+' 件</div>';
      html += '<table><thead><tr><th>商品名称</th><th>进货单位</th><th>补货数量</th></tr></thead><tbody>';
      arr.forEach(i=>{
        const ou = orderUnit(i.p);
        html += '<tr><td>'+esc(i.p.name)+'</td><td>'+ou+'</td><td>'+i.qty+'</td></tr>';
        csv += '"'+csvEsc(i.p.name)+'","'+ou+'",'+i.qty+'\n';
      });
      html += '</tbody></table></div>';
    });
    html = '<p style="margin:0 0 12px;color:var(--muted);font-size:13px">共 <b style="color:var(--text)">'+totalQty+'</b> 件，已按 <b style="color:var(--accent-ink)">'+Object.keys(groups).length+'</b> 个供货商分组。</p>'+html;
    modalBody.innerHTML = html + '<div id="canvasWrap" style="margin-top:14px"></div>';
    lastCSV = csv;
    lastCanvas = buildOrderCanvas();
    document.getElementById("canvasWrap").appendChild(lastCanvas);
    const shareBtn = document.getElementById("shareBtn");
    if(navigator.canShare && navigator.canShare({files:[new File([new Uint8Array(1)],"x.png",{type:"image/png"})]})){
      shareBtn.style.display = "";
    } else {
      shareBtn.style.display = "none";
    }
    mask.classList.add("show");
  };
  document.getElementById("closeBtn").onclick = ()=> mask.classList.remove("show");
  mask.onclick = (e)=>{ if(e.target===mask) mask.classList.remove("show"); };
  document.getElementById("copyBtn").onclick = ()=>{
    const text = csvToText();
    navigator.clipboard?.writeText(text).then(()=>toast("已复制到剪贴板"),()=>fallbackCopy(text));
  };
  document.getElementById("dlBtn").onclick = ()=>{
    const blob = new Blob(["\ufeff"+lastCSV], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "补货单_"+new Date().toISOString().slice(0,10)+".csv";
    a.click(); URL.revokeObjectURL(a.href);
    toast("已下载 CSV 补货单");
  };
  document.getElementById("imgBtn").onclick = ()=>{
    if(!lastCanvas) return;
    lastCanvas.toBlob(blob=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "补货单_"+new Date().toISOString().slice(0,10)+".png";
      a.click(); URL.revokeObjectURL(a.href);
      toast("已保存补货单图片");
    }, "image/png");
  };
  document.getElementById("shareBtn").onclick = ()=>{
    if(!lastCanvas) return;
    lastCanvas.toBlob(async blob=>{
      const file = new File([blob], "补货单.png", {type:"image/png"});
      try{ await navigator.share({files:[file], title:"店内补货单"}); }catch(e){}
    }, "image/png");
  };

  function csvToText(){
    const items = cartItems();
    const groups = {};
    items.forEach(i=>{ (groups[i.p.supplier] = groups[i.p.supplier]||[]).push(i); });
    let out = "【补货单】\n";
    const totalQty = items.reduce((s,i)=>s+i.qty,0);
    Object.keys(groups).forEach(sup=>{
      const arr = groups[sup];
      const gq = arr.reduce((s,i)=>s+i.qty,0);
      out += "\n▸ "+sup+"（"+gq+" 件）\n";
      arr.forEach(i=> out += "  · "+i.p.name+"  ×"+i.qty+" "+orderUnit(i.p)+"\n");
    });
    out += "\n合计："+totalQty+" 件\n";
    return out;
  }
  function csvEsc(s){ return String(s).replace(/"/g,'""'); }
  function fallbackCopy(text){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); toast("已复制到剪贴板");}catch(e){toast("复制失败，请手动复制");}
    document.body.removeChild(ta);
  }

  // ---- build shareable order image ----
  function roundRect(ctx,x,y,w,h,r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function clipText(ctx,text,maxW){
    if(ctx.measureText(text).width<=maxW) return text;
    let t=text;
    while(t.length>1 && ctx.measureText(t+"…").width>maxW){ t=t.slice(0,-1); }
    return t+"…";
  }
  function buildOrderCanvas(){
    const items=cartItems();
    const groups={};
    items.forEach(i=>{(groups[i.p.supplier]=groups[i.p.supplier]||[]).push(i);});
    const W=720, pad=26;
    const titleH=64, metaH=34, groupHeadH=44, lineH=34, footH=56, gap=12;
    const totalQty=items.reduce((s,i)=>s+i.qty,0);
    let h=pad+titleH+metaH+gap;
    Object.keys(groups).forEach(sup=>{ h+=groupHeadH+6; groups[sup].forEach(()=>h+=lineH); h+=10; });
    h+=footH+pad;

    const scale=2;
    const c=document.createElement("canvas");
    c.width=W*scale; c.height=Math.ceil(h)*scale;
    c.style.width="100%"; c.style.height="auto"; c.style.display="block"; c.style.borderRadius="12px";
    const ctx=c.getContext("2d"); ctx.scale(scale,scale);
    const R=16;

    roundRect(ctx,0,0,W,h,R); ctx.fillStyle="#ffffff"; ctx.fill();
    ctx.save(); roundRect(ctx,0,0,W,h,R); ctx.clip();

    // title strip
    const g=ctx.createLinearGradient(0,0,W,titleH);
    g.addColorStop(0,"#1f9d74"); g.addColorStop(1,"#2bb98a");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,titleH);
    ctx.fillStyle="#ffffff"; ctx.textBaseline="middle";
    ctx.font='bold 26px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign="left";
    ctx.fillText("🛒 店内补货单", pad, titleH/2);
    ctx.font='14px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="right"; ctx.fillStyle="rgba(255,255,255,.92)";
    ctx.fillText(new Date().toLocaleDateString("zh-CN"), W-pad, titleH/2);

    // meta
    let y=pad+titleH+metaH/2;
    ctx.fillStyle="#6b7280"; ctx.font='14px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("共 "+totalQty+" 件 · "+Object.keys(groups).length+" 个供货商", pad, y);

    y=pad+titleH+metaH+gap;
    Object.keys(groups).forEach(sup=>{
      const arr=groups[sup];
      const gq=arr.reduce((s,i)=>s+i.qty,0);
      roundRect(ctx,pad,y,W-pad*2,groupHeadH,10); ctx.fillStyle="#eaf3fc"; ctx.fill();
      ctx.fillStyle="#1f9d74"; ctx.font='bold 16px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText(sup, pad+12, y+groupHeadH/2);
      ctx.fillStyle="#5a606b"; ctx.font='13px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="right";
      ctx.fillText(gq+" 件", W-pad-12, y+groupHeadH/2);
      y+=groupHeadH+6;
      arr.forEach(i=>{
        const ou = orderUnit(i.p);
        ctx.fillStyle="#2b2f36"; ctx.font='14px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="left"; ctx.textBaseline="middle";
        ctx.fillText(clipText(ctx,i.p.name, W-pad*2-160), pad+12, y+lineH/2);
        ctx.fillStyle="#5a606b"; ctx.textAlign="right";
        ctx.fillText("×"+i.qty+" "+ou, W-pad-12, y+lineH/2);
        y+=lineH;
      });
      y+=10;
    });

    // footer
    ctx.fillStyle="#f3f8fe"; ctx.fillRect(0,h-footH,W,footH);
    ctx.fillStyle="#2b2f36"; ctx.font='15px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("合计", pad, h-footH/2);
    ctx.fillStyle="#1f9d74"; ctx.font='bold 24px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign="right";
    ctx.fillText(totalQty+" 件", W-pad, h-footH/2);

    ctx.restore();
    ctx.lineWidth=1; ctx.strokeStyle="#e3eaf3"; roundRect(ctx,0.5,0.5,W-1,h-1,R); ctx.stroke();
    return c;
  }

  // ---- barcode scanner ----
  const scanBtn = document.getElementById("scanBtn");
  const scanMask = document.getElementById("scanMask");
  const scanVideo = document.getElementById("scanVideo");
  const scanTip = document.getElementById("scanTip");
  const scanClose = document.getElementById("scanClose");
  const scanManual = document.getElementById("scanManual");
  const scanManualBtn = document.getElementById("scanManualBtn");
  let scanStream=null, scanRAF=null, scanDetector=null;

  function openScanner(){ scanMask.classList.add("show"); scanTip.textContent="正在启动摄像头…"; startCamera(); }
  function closeScanner(){ scanMask.classList.remove("show"); stopCamera(); }
  async function startCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      scanTip.textContent="当前环境不支持摄像头，请手动输入条码";
      return;
    }
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
      scanVideo.srcObject = scanStream;
      await scanVideo.play();
      scanTip.textContent="将商品条码对准取景框";
      startDetect();
    }catch(e){
      scanTip.textContent="无法访问摄像头，请手动输入条码";
    }
  }
  function stopCamera(){
    if(scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF=null;
    if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
    scanVideo.srcObject=null;
  }
  function startDetect(){
    if(!("BarcodeDetector" in window)){ scanTip.textContent="浏览器不支持自动识别，请手动输入条码"; return; }
    if(!scanDetector){
      try{ scanDetector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]}); }
      catch(e){ try{ scanDetector = new BarcodeDetector(); }catch(e2){ scanDetector=null; } }
    }
    if(!scanDetector){ scanTip.textContent="浏览器不支持自动识别，请手动输入条码"; return; }
    const loop = async ()=>{
      if(!scanStream) return;
      try{
        const codes = await scanDetector.detect(scanVideo);
        if(codes.length){ applyScanned(codes[0].rawValue); return; }
      }catch(e){}
      scanRAF = requestAnimationFrame(loop);
    };
    scanRAF = requestAnimationFrame(loop);
  }
  function applyScanned(v){
    closeScanner();
    const q = document.getElementById("q");
    q.value = v; state.q = v.toLowerCase(); state.page = 1; render();
    toast("已录入条码：" + v);
  }
  scanBtn.addEventListener("click", openScanner);

  const qrBtn = document.getElementById("qrBtn");
  const qrModal = document.getElementById("qrModal");
  const qrUrl = document.getElementById("qrUrl");
  const DEPLOY_URL = "https://0dbf5c6e8aa246e89e3e977c5aa94dd3.bj7.agentos-app.net/";
  qrBtn.onclick = ()=>{ qrUrl.textContent = DEPLOY_URL; qrModal.classList.add("show"); };
  qrModal.addEventListener("click", (e)=>{ if(e.target===qrModal) qrModal.classList.remove("show"); });
  document.getElementById("qrClose").onclick = ()=> qrModal.classList.remove("show");
  scanClose.addEventListener("click", closeScanner);
  scanMask.addEventListener("click", e=>{ if(e.target===scanMask) closeScanner(); });
  scanManualBtn.addEventListener("click", ()=>{ const v=scanManual.value.trim(); if(v) applyScanned(v); });
  scanManual.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=scanManual.value.trim(); if(v) applyScanned(v); } });

  // ---- toast ----
  let toastTimer;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- init ----
  render(); renderCart();
})();
</script>
</body>
</html>
